[project]
name = "kbench"
version = "0.1.0"
description = "Automatic, resumable benchmark harness for RDF / knowledge-store engines"
authors = [{ name = "Samuele Facenda", email = "samuele.facenda@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "rich",
    "psutil",
    "requests",
    "rdflib",
    "sparqlwrapper",
]

[project.scripts]
kbench = "bench.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bench*"]

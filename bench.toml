# Default benchmark configuration: the native engines on the mini_* samples.
#
# Run with:  kbench run --config bench.toml
# List what is available here:  kbench list-engines | list-queries | list-datasets
# Full reference: docs/configuration.md

run_name = "default"
repetitions = 10   # measured runs per (engine, dataset, query)
warmup = 2         # discarded runs before each measured batch (avoids cold cache)
timeout_s = 300    # per-query timeout
output_dir = "runs"

# Memory budget per engine (one engine runs at a time, so each may claim it all).
# Fraction of system RAM; the harness reserves ~25% on top for native/off-heap use.
# Defaults to 0.5 when unset. Override with an absolute memory_gb instead.
mem_fraction = 0.75
# memory_gb = 32

# The engines nix builds natively: nothing to pull, cheapest to run.
# Add the docker ones when a daemon is up: "virtuoso", "graphdb", "rdfox", "stardog".
engines = ["oxigraph", "fuseki", "qendpoint", "qlever"]

# Datasets to load — one logical graph each; every engine auto-picks a serialization it
# supports (see `kbench list-datasets`). The mini_* samples are a head of the big graphs:
# same shape, seconds instead of days. The big files are opt-in.
datasets = ["mini_heritage", "mini_urban"]
# datasets = ["torre_modena", "ytu3d", "nettuno"]   # the big ones

# Query names, or the literal "all".
queries = "all"

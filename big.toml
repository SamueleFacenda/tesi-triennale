# Example benchmark configuration.
#
# Run with:  kbench run --config bench.toml
# List available engines / queries / datasets:  kbench list-engines | list-queries
#
# Start small (native engines, a small dataset) and opt into the big files explicitly.

run_name = "big"
repetitions = 8    # measured runs per (engine, dataset, query)
warmup = 2         # discarded runs before each measured batch (avoids cold cache)
timeout_s = 600    # per-query timeout
output_dir = "runs"

# Memory budget per engine (one engine runs at a time, so each may claim it all).
# Default: 75% of system RAM. Override explicitly with memory_gb.
mem_fraction = 0.75
# memory_gb = 32

# Native, self-hostable engines (build first / cheapest to run).
# Docker engines available too: "virtuoso", "graphdb", "rdfox", "stardog"
engines = ["oxigraph", "fuseki", "qendpoint", "qlever", "virtuoso", "graphdb", "rdfox", "rdflib", "rdflib-bdb", "owlready2"]


# Datasets to load — one logical graph each; every engine auto-picks a serialization it
# supports (see `kbench list-datasets`). Big files are opt-in; the mini_* samples give a
# fast, real-shaped complete test.
# datasets = ["mini_heritage", "mini_urban"]
datasets = ["ytu3d", "torre_modena", "nettuno", "grande"]   # the big ones

# Query names, or the literal "all".
queries = "all"

# Engine/dataset pairs to skip (must be last: everything below belongs to this table).
# grande is 147M triples: rdflib-bdb would need ~94 GB of BerkeleyDB store — more disk
# than is free — for queries that all time out anyway; it already times out on 2 of 8 at
# ytu3d's 9.6M.
# Plain rdflib is skipped there too: it parses the whole graph into memory, so the load is
# OOM-killed (SIGKILL) every time. Excluding it costs nothing — a failed load already skips
# that dataset's queries — but it stops each resume from re-paying the OOM to relearn it.
[exclude]
rdflib-bdb = ["grande"]
rdflib = ["grande"]
